[project]
name = "universe"
version = "0.1.0"
description = "CG Pipeline source-publication pilot"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.6.1",
    "latex2mathml>=3.81",
    "Pillow>=11.3",
    "img2pdf>=0.6.1",
    "browserbase==1.8.0",
    "playwright==1.59.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live_e2e: explicitly gated tests that can contact real external providers",
]
