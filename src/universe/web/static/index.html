<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview · concept universe</title>
  <script src="/static/theme_boot.js?v=1"></script>
  <link rel="stylesheet" href="/static/shell.css?v=1">
  <link rel="stylesheet" href="/static/index.css?v=4">
</head>
<body>
  <div data-admin-shell></div>
  <main class="admin-page workspace overview-workspace">
    <header class="workspace__heading">
      <div>
        <h1>Overview</h1>
        <p class="admin-page__intro">Each body of course material, and what the pipeline has made of it so far.</p>
      </div>
    </header>

    <p class="overview-status" data-status role="status" aria-live="polite">Loading overview…</p>

    <section class="overview-corpora" data-corpora aria-label="Corpora"></section>

    <section class="panel overview-panel" aria-labelledby="universe-heading">
      <div class="overview-panel__heading">
        <h2 id="universe-heading">Universe</h2>
        <a class="overview-panel__more" href="/universe">Open the universe</a>
      </div>
      <div data-universe></div>
    </section>

    <section class="panel overview-panel overview-panel--attention" aria-labelledby="attention-heading">
      <div class="overview-panel__heading">
        <h2 id="attention-heading">Needs a decision</h2>
        <p>Only things waiting on you. Unacquired sources are counted above, not listed here.</p>
      </div>
      <div data-attention></div>
    </section>

    <p class="overview-ledger" data-ledger></p>
  </main>
  <script type="module" src="/static/index.js?v=5"></script>
</body>
</html>
