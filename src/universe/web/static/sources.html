<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sources · Concept Universe</title>
  <script src="/static/theme_boot.js?v=1"></script>
  <link rel="stylesheet" href="/static/shell.css?v=1">
  <link rel="stylesheet" href="/static/sources.css?v=5">
</head>
<body>
  <div data-admin-shell></div>
  <main class="admin-page workspace sources-workspace">
    <p class="sr-only" role="status" aria-live="polite" data-status></p>

    <section data-list-view>
      <header class="workspace__heading">
        <div>
          <h1>Sources <span class="sources-title-count" data-title-count></span></h1>
          <p class="admin-page__intro">Every source, separated by corpus. Status says whether its material has been acquired;
            the pipeline strip shows how far its material has travelled through the stages.</p>
        </div>
      </header>

      <section class="filter-panel sources-control-panel" aria-label="Source filters">
        <div class="sources-corpus-tabs" data-corpus-tabs role="tablist" aria-label="Corpus"></div>
        <label class="sources-filter">
          <span class="sr-only">Filter by media type</span>
          <select class="field" data-media-filter>
            <option value="">All media types</option>
          </select>
        </label>
        <label class="sources-attention-toggle">
          <input class="sources-attention-toggle__input" type="checkbox" data-attention-filter>
          <span class="sources-attention-toggle__box" aria-hidden="true"></span>
          Needs attention
        </label>
        <span class="sources-filter-summary" data-filter-summary></span>
      </section>

      <div data-roster></div>
    </section>

    <section data-detail-view hidden></section>
  </main>
  <script type="module" src="/static/shell.js?v=2"></script>
  <script type="module" src="/static/sources.js?v=4"></script>
</body>
</html>
