services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: universe
      POSTGRES_PASSWORD: universe
      POSTGRES_DB: universe
    ports:
      # 5432 on the host belongs to the Companion project's compose.
      - "5433:5432"
    volumes:
      - universe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U universe -d universe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  universe-pgdata:
